name: "PR Lint (frontend)"

on:
    pull_request:
        branches: ["master"]
        paths-ignore:
            - src-tauri/**

jobs:
    frontend-lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"
                  cache-dependency-path: package-lock.json
            - name: Install dependencies
              run: npm ci
            - name: Check
              run: npm run check
            - name: Lint
              run: npm run lint
