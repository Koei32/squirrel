[package]
name = "squirrel"
version = "0.1.0"
description = "A clipboard manager"
repository = "https://github.com/Koei32/squirrel"
authors = ["Koei"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = {  version = "2.0.0", features = [ "tray-icon", "image-png" ] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-prevent-default = "5"
clipboard-rs = "0.3.4"
anyhow = "1.0.102"
tokio = { version="1.52.3", features = ["macros"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "macros"] }
tauri-plugin-clipboard-manager = "2.0.0"
chrono = "0.4.44"
enigo = "0.6.1"
dirs = "6.0.0"
sysinfo = "0.39.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
